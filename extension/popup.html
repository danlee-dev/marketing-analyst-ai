<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>레퍼런스 보관함</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand"><img src="icons/logo.svg" alt="" class="mark" />레퍼런스 보관함</div>
      <button class="icon" id="btn-settings" type="button" aria-label="설정">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </header>

    <!-- 연결 전 -->
    <section id="v-connect" class="view hidden">
      <h1>보관함과 연결해요</h1>
      <p class="lead">사이트에 로그인한 상태에서 연결하기를 누르면 토큰이 자동으로 들어와요.</p>
      <button class="btn primary wide" id="btn-connect" type="button">사이트에서 연결하기</button>
      <details class="manual">
        <summary>토큰을 직접 붙여넣기</summary>
        <input id="in-token" placeholder="rb_로 시작하는 토큰" autocomplete="off" spellcheck="false" />
        <button class="btn quiet" id="btn-token" type="button">저장</button>
      </details>
    </section>

    <!-- 메인 -->
    <section id="v-main" class="view hidden">
      <button class="dest" id="btn-dest" type="button">
        <span class="dest-label">저장 위치</span>
        <span class="dest-path" id="dest-path">불러오는 중</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>

      <div class="picker hidden" id="picker">
        <input id="in-filter" placeholder="프로젝트·폴더 찾기" autocomplete="off" />
        <div class="picker-list" id="picker-list"></div>
      </div>

      <article class="page" id="page">
        <div class="page-top">
          <span class="badge" id="page-badge"></span>
          <span class="page-host" id="page-host"></span>
        </div>
        <p class="page-title" id="page-title"></p>
      </article>

      <div class="opts" id="opts">
        <label class="toggle" id="t-shot"><input type="checkbox" id="c-shot" /><span class="sw"></span>화면 캡처 같이 저장</label>
        <label class="toggle" id="t-tr"><input type="checkbox" id="c-tr" checked /><span class="sw"></span>영상 자동 전사</label>
        <button class="link" id="btn-note" type="button">메모 남기기</button>
        <textarea id="in-note" class="hidden" rows="3" placeholder="왜 저장했는지, 따라 할 점"></textarea>
      </div>

      <button class="btn primary wide" id="btn-save" type="button">보관함에 저장</button>
      <p class="msg" id="msg"></p>

      <section class="bulk hidden" id="bulk">
        <div class="bulk-head">
          <div>
            <p class="bulk-title" id="bulk-title"></p>
            <p class="bulk-sub" id="bulk-sub"></p>
          </div>
          <button class="btn quiet" id="btn-collect" type="button">끝까지 모으기</button>
        </div>
        <button class="btn primary wide hidden" id="btn-import" type="button"></button>
      </section>

      <section class="queue hidden" id="queue">
        <div class="queue-head">
          <p class="queue-title" id="queue-title"></p>
          <button class="link" id="btn-queue" type="button"></button>
        </div>
        <div class="bar"><span id="queue-bar"></span></div>
        <ul class="queue-list" id="queue-list"></ul>
      </section>

      <section class="recent hidden" id="recent">
        <p class="sec">최근 저장</p>
        <ul id="recent-list"></ul>
      </section>
    </section>

    <!-- 설정 -->
    <section id="v-settings" class="view hidden">
      <h1>설정</h1>
      <p class="lead" id="who"></p>
      <ul class="tips">
        <li><b>Alt+Shift+S</b> 지금 페이지를 마지막 저장 위치에 바로 저장</li>
        <li><b>우클릭</b> 링크 저장 · 화면 캡처 · 선택한 문구를 메모로</li>
        <li><b>인스타</b> 오른쪽 아래 버튼으로 게시물 저장, 저장됨 컬렉션 통째로 가져오기</li>
      </ul>
      <div class="row-btns">
        <button class="btn quiet" id="btn-open" type="button">사이트 열기</button>
        <button class="btn danger" id="btn-logout" type="button">연결 끊기</button>
      </div>
      <button class="link back" id="btn-back" type="button">돌아가기</button>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
